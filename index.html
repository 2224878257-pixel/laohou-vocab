let voices=[], reading=false, mode='all';
function loadVoices(){
 voices=speechSynthesis.getVoices();
 const en=voices.map((v,i)=>[v,i]).filter(([v])=>/^en/i.test(v.lang));
 const zh=voices.map((v,i)=>[v,i]).filter(([v])=>/^zh/i.test(v.lang));
 const enSel=document.getElementById('voiceEn'), zhSel=document.getElementById('voiceZh');
 enSel.innerHTML=''; zhSel.innerHTML='';
 en.forEach(([v,i])=>{let o=document.createElement('option');o.value=i;o.textContent=`英文：${v.name} (${v.lang})`;enSel.appendChild(o);});
 zh.forEach(([v,i])=>{let o=document.createElement('option');o.value=i;o.textContent=`中文：${v.name} (${v.lang})`;zhSel.appendChild(o);});
}
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function utter(text,lang,rate,voiceIndex,cb){
 const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;
 const idx=parseInt(voiceIndex||'-1');if(idx>=0&&voices[idx])u.voice=voices[idx];
 if(cb)u.onend=cb;speechSynthesis.speak(u);
}
function stopSpeech(){reading=false;speechSynthesis.cancel();}
function setMode(m){mode=m;stopSpeech();render();}
function filteredData(){
 const q=(document.getElementById('search').value||'').trim().toLowerCase();
 return data.filter(r=>{
   const isPro=!!r['优先级'];
   if(mode==='pro'&&!isPro)return false;
   if(mode==='base'&&isPro)return false;
   if(!q)return true;
   return Object.values(r).some(v=>String(v||'').toLowerCase().includes(q));
 });
}
function speakOne(r,withExamples=true){
 speechSynthesis.cancel();
 const enRate=parseFloat(rateEn.value||'0.85'),zhRate=parseFloat(rateZh.value||'1.0');
 const enVoice=voiceEn.value,zhVoice=voiceZh.value;
 utter(r['英文'],'en-US',enRate,enVoice,()=>setTimeout(()=>utter(r['中文'],'zh-CN',zhRate,zhVoice,()=>{
   if(withExamples){
     setTimeout(()=>utter(r['英文例句'],'en-US',enRate,enVoice,()=>setTimeout(()=>utter(r['中文例句'],'zh-CN',zhRate,zhVoice),220)),220);
   }
 }),220));
}
function playCurrentList(){
 const list=filteredData();if(!list.length)return;reading=true;let i=0;speechSynthesis.cancel();
 const enRate=parseFloat(rateEn.value||'0.85'),zhRate=parseFloat(rateZh.value||'1.0');
 const enVoice=voiceEn.value,zhVoice=voiceZh.value,examples=includeExamples.checked;
 function next(){
   if(!reading||i>=list.length){reading=false;return;}
   const r=list[i++];
   utter(r['英文'],'en-US',enRate,enVoice,()=>setTimeout(()=>utter(r['中文'],'zh-CN',zhRate,zhVoice,()=>{
     if(examples){
       setTimeout(()=>utter(r['英文例句'],'en-US',enRate,enVoice,()=>setTimeout(()=>utter(r['中文例句'],'zh-CN',zhRate,zhVoice,()=>setTimeout(next,500)),220)),220);
     }else setTimeout(next,450);
   }),220));
 }
 next();
}
function render(){
 const list=filteredData();count.textContent=`当前 ${list.length} / ${data.length} 个词`;grid.innerHTML='';
 list.forEach(r=>{
   const c=document.createElement('article');c.className='card';
   c.innerHTML=`<div class="word">${r['英文']}</div><div class="zh">${r['中文']}</div>
   <div class="meta">${r['分类']||'其他'}${r['使用场景']?' · '+r['使用场景']:''}</div>
   <div class="example"><div>${r['英文例句']}</div><div class="example-cn">${r['中文例句']}</div></div>
   <div class="actions"><button class="secondary a">🔊 单词+中文</button><button class="ghost b">▶ 完整朗读</button></div>`;
   c.querySelector('.word').onclick=()=>speakOne(r,false);
   c.querySelector('.a').onclick=()=>speakOne(r,false);
   c.querySelector('.b').onclick=()=>speakOne(r,true);
   grid.appendChild(c);
 });
}
render();
